<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonkyeom Kim — Portfolio</title>
  <meta name="description" content="Moonkyeom Kim의 디자인·프로젝트 포트폴리오">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body data-view="book" data-book="closed">
  <a class="skip" href="#/design">작업물 바로가기</a>

  <header class="top">
    <a class="name" href="#/">Moonkyeom Kim</a>
    <nav aria-label="주요 메뉴">
      <a href="#/" data-nav="book">Book</a>
      <a href="#/design" data-nav="design">Design</a>
      <a href="#/projects" data-nav="projects">Project</a>
    </nav>
  </header>

  <main>
    <section class="stage" id="stage" aria-label="책 인터랙션">
      <canvas id="scene" aria-label="흰 탁자 위에 놓인 빨간 책. 누르면 『멋진 신세계』가 펼쳐집니다." role="img"></canvas>

      <button class="reset" id="reset" type="button" hidden>시점 초기화</button>

      <div class="stage-ui closed-ui">
        <p class="intro" id="intro"></p>
        <button class="hint" id="open" type="button">
          <span class="thread" aria-hidden="true"></span>책을 눌러 펼치기 · 드래그로 둘러보기
        </button>
      </div>

      <div class="stage-ui open-ui">
        <p class="tip">페이지를 누르면 넘어가고, 책을 잡고 흔들면 실이 흔들립니다<br>빈 곳을 드래그하면 시점이 돌고, 휠로 확대됩니다</p>
        <div class="pager">
          <button id="prev" type="button" aria-label="이전 장">←</button>
          <span id="count" aria-live="polite">1 / 4</span>
          <button id="next" type="button" aria-label="다음 장">→</button>
          <button id="close" type="button" class="close">덮기</button>
        </div>
      </div>
    </section>

    <section class="works" id="works" hidden>
      <div class="works-head">
        <h1 id="works-title">Design</h1>
        <p id="works-meta"></p>
      </div>
      <ul class="grid" id="grid"></ul>
      <footer class="foot">
        <span>© <span id="year"></span> Moonkyeom Kim</span>
        <a id="mail" hidden></a>
      </footer>
    </section>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <button class="detail-close" id="detail-close" type="button" aria-label="닫기">닫기</button>
    <div class="detail-body">
      <div class="detail-media" id="detail-media"></div>
      <div class="detail-copy">
        <p class="eyebrow" id="detail-eyebrow"></p>
        <h2 id="detail-title"></h2>
        <p class="desc" id="detail-desc"></p>
        <div class="detail-links" id="detail-links"></div>
      </div>
    </div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
